# Reviews every pull request against the Databricks workspace with Genie Code and Genie One.
# https://github.com/guanjieshen/genie_code_code_review_gh_action
name: Genie Data Review

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  genie-data-review:
    if: vars.DATABRICKS_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: guanjieshen/genie_code_code_review_gh_action@v0
        with:
          databricks-host: ${{ vars.DATABRICKS_HOST }}
          client-id: ${{ vars.GENIE_REVIEWER_CLIENT_ID }}
          client-secret: ${{ secrets.GENIE_REVIEWER_CLIENT_SECRET }}
          bundle-target: prod
          # Optional (all inputs: https://github.com/guanjieshen/genie_code_code_review_gh_action/blob/main/docs/inputs.md)
          # fail-on: blocker                  # fail the check on blocking issues (or: critical | high | medium)
          # semantic: off                     # skip Genie One business-definition checks
          # genie-host: https://<workspace>   # workspace that serves the Genie Code model, if this one does not
          # analysis-depth: detailed        # also check joins, grain, and codes against your Pages (Genie One)
          # Team context goes in .lakehouse-review/instructions.md (set instructions_file in .lakehouse-review/config.yml).
